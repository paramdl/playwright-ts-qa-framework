name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 3 * * 1-5' # weekdays 09:00 IST, catches drift in the demo apps
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [api, ui-chromium, ui-webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Install browser
        if: matrix.project != 'api'
        run: npx playwright install --with-deps ${{ matrix.project == 'ui-webkit' && 'webkit chromium' || 'chromium' }}
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.project }}
          path: reports/
          retention-days: 14
